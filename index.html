<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="app-container">

        <aside class="sidebar">
            <div class="logo">VUZOLL</div>

            <nav class="sidebar-nav inbox-nav">
                <a href="#" class="nav-item">
                    <span class="icon"></span> Inbox
                    <span class="badge">5 open tickets</span>

                    <section class="menu">
                        <a href="#" class="menu_logo"><img src="img/header/Logo.svg" alt=""></a>
                        <ul class="menu_inbox">
                            <li class="menu_item">
                                <a href="#" class="menu_link">
                                    <img src="img/header/Inbox icon.svg" alt="Inbox">
                                    <span>Inbox <br> 5 open tickets</span></a>
                            </li>
                        </ul>
                        <ul class="menu_list">
                            <li class="menu_item">
                                <a href="#" class="menu_link">
                                    <img src="img/header/hugeicons_customize.svg" alt="Your assistant">
                                    <span>Your assistant</span><img class="arrow"
                                        src="img/ic/chevron_right_24dp_383838_FILL0_wght400_GRAD0_opsz48 1.svg" alt="">

                                </a>
                            </li>
                            </li>
                            <li class="menu_item">
                                <a href="#" class="menu_link">
                                    <img src="img/header/stacks_24dp_383838_FILL0_wght400_GRAD0_opsz48 1.svg"
                                        alt="Workspace">
                                    <span>Workspace</span><img class="arrow"
                                        src="img/ic/chevron_right_24dp_383838_FILL0_wght400_GRAD0_opsz48 1.svg" alt="">
                                </a>
                            </li>
                            </li>
                            <li class="menu_item">
                                <a href="#" class="menu_link">
                                    <img src="img/header/icon-park-outline_more-app.svg" alt="Integrations">
                                    <span>Integrations</span><img class="arrow"
                                        src="img/ic/chevron_right_24dp_383838_FILL0_wght400_GRAD0_opsz48 1.svg" alt="">
                                </a>

                                <a href="#" class="nav-item">
                                    <span class="icon"></span> Integrations
                                </a>
            </nav>

            <nav class="sidebar-nav bottom-nav">
                <a href="#" class="nav-item">
                    <span class="icon"></span> Notifications
                </a>
                <a href="#" class="nav-item active">
                    <span class="icon"></span> Settings
                </a>
            </nav>
        </aside>

        <div class="main-area">

            <header class="main-header">
                Settings
            </header>

            <main class="settings-content">

                <section class="settings-section">
                    <div class="section-card">
                        <h2>Personal Information</h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" placeholder="Sophia">
                            </div>

                            <div class="form-group">
                                <label for="surname">Surname</label>
                                <input type="text" id="surname" placeholder="Miller">
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" placeholder="sophia.miller@email.com">
                            </div>

                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" placeholder="+1 (066) 789-6052">
                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    </li>
    </div>
    </ul>
    <ul class="menu_admin">
        <li class="admin_item">
            <a href="" class="admin_link">
                <img src="img/header/famicons_notifications-outline (2).svg" alt="Notifications">
                </div>
                <span>Notifications</span>
            </a>
        </li>
        <li class="admin_item">
            <a href="" class="admin_link">
                <img src="img/header/solar_settings-linear.svg" alt="Settings">
                <span>Settings</span>
            </a>
        </li>
    </ul>
    </section>
</body>

</html>
